<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Pedidos PrestaShop ↔ Ambar{% endblock %}</title>
    <meta name="description" content="Sistema de gestión de pedidos PrestaShop integrado con Ambar ERP">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- App CSS -->
    <link href="/static/css/app.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>

<!-- Topbar -->
<nav class="navbar navbar-dark topbar px-3 py-2">
    <div class="d-flex align-items-center gap-2">
        <i class="bi bi-box-arrow-in-right fs-4 text-accent"></i>
        <span class="fw-700 fs-5">Gestión Pedidos</span>
        <span class="badge bg-accent text-dark ms-1">PrestaShop ↔ Ambar</span>
    </div>
    <div class="d-flex align-items-center gap-3">
        <div id="spinner-global" class="spinner-border spinner-border-sm text-accent d-none" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <small class="text-muted-light">v1.0</small>
    </div>
</nav>

<!-- Toast container -->
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>

<!-- HTMX: spinner global -->
<script>
    document.addEventListener('htmx:beforeRequest', () => {
        document.getElementById('spinner-global').classList.remove('d-none');
    });
    document.addEventListener('htmx:afterRequest', () => {
        document.getElementById('spinner-global').classList.add('d-none');
    });
</script>
</body>
</html>
