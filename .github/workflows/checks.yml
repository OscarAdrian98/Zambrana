name: Portfolio checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Tree policy, secrets and Python syntax
        run: python -B tools/check_repository.py
      - name: PHP and JavaScript syntax
        run: python -B tools/check_syntax.py

  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fichaje
            lock: fichaje/requirements-dev.lock
          - project: pedidos
            lock: Gestion-Pedidos/requirements-dev.lock
          - project: stock
            lock: Stock2.0/requirements-dev.lock
          - project: factura
            lock: Factura/requirements-dev.lock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install this project's test environment
        run: python -m pip install -r ${{ matrix.lock }}
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run synthetic tests with networking blocked
        run: python -B tools/run_tests.py ${{ matrix.project }}
