{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<!-- Encabezado con logo -->
<div class="bg-white text-center py-2 border-bottom shadow-sm">
    <img src="{{ url_for('static', filename='logo-demo.jpg') }}" alt="Logo demo" style="height: 55px;">
</div>

<!-- Formulario de login -->
<div class="container d-flex justify-content-center align-items-center mt-4 mb-5">
    <div class="card login-card shadow-sm p-4 w-100" style="max-width: 400px;">
        <h2 class="mb-4 text-center fw-bold">Iniciar sesión</h2>

        <form method="POST" id="loginForm" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="email">📧 Email:</label>
                <input type="email" name="email" id="email" class="form-control"
                       placeholder="empleado@example.test" autocomplete="email"
                       maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">🔒 Contraseña:</label>
                <input type="password" name="password" id="password" class="form-control"
                       placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <div class="form-check mb-3 text-start">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label" for="remember">
                    Recuérdame
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">🔓 Entrar</button>
        </form>

        <p class="mt-3 text-center text-muted">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
        </p>
    </div>
</div>

<!-- Script para recordar solo el email si se marca "Recuérdame" -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const emailInput = document.getElementById("email");
    const rememberCheckbox = document.getElementById("remember");
    const loginForm = document.getElementById("loginForm");

    let rememberedEmail = null;

    try {
        // Eliminar cualquier contraseña guardada por versiones antiguas.
        localStorage.removeItem("rememberedPassword");

        // Cargar únicamente el email si existe.
        rememberedEmail = localStorage.getItem("rememberedEmail");
    } catch (error) {
        // El login sigue funcionando aunque el navegador bloquee localStorage.
    }

    if (rememberedEmail) {
        emailInput.value = rememberedEmail;
        rememberCheckbox.checked = true;
    }

    // Al enviar el formulario
    loginForm.addEventListener("submit", function () {
        try {
            if (rememberCheckbox.checked) {
                localStorage.setItem("rememberedEmail", emailInput.value);
            } else {
                localStorage.removeItem("rememberedEmail");
            }
        } catch (error) {
            // Recordar el email es opcional y no debe impedir iniciar sesión.
        }
    });
});
</script>
{% endblock %}
