{% extends "base.html" %}
{% block title %}Registro{% endblock %}

{% block content %}
<!-- Encabezado con logo -->
<div class="bg-white text-center py-2 border-bottom shadow-sm">
    <img src="{{ url_for('static', filename='logo-demo.jpg') }}" alt="Logo demo" style="height: 55px;">
</div>

<!-- Formulario de registro -->
<div class="container d-flex justify-content-center align-items-center mt-4 mb-5">
    <div class="card shadow-sm p-4 w-100" style="max-width: 400px;">
        <h2 class="mb-4 text-center fw-bold">Crear cuenta</h2>
        <p class="text-muted text-center">
            Crea directamente tu cuenta de empleado para acceder al fichaje.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="nombre">👤 Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                       placeholder="Tu nombre completo" autocomplete="name"
                       minlength="2" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">📧 Email:</label>
                <input type="email" name="email" id="email" class="form-control"
                       placeholder="empleado@example.test" autocomplete="email"
                       maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">🔒 Contraseña:</label>
                <input type="password" name="password" id="password" class="form-control"
                       autocomplete="new-password" minlength="10" maxlength="128"
                       required>
                <div class="form-text">
                    Entre 10 y 128 caracteres. Puedes utilizar una frase de contraseña.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmar_password">
                    🔒 Confirmar contraseña:
                </label>
                <input type="password" name="confirmar_password"
                       id="confirmar_password" class="form-control"
                       autocomplete="new-password" minlength="10" maxlength="128"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="puesto">💼 Puesto de trabajo:</label>
                <select name="puesto" id="puesto" class="form-select" required>
                    <option value="">Selecciona un puesto</option>
                    <option value="Informático">Informático</option>
                    <option value="Mozo Almacén">Mozo Almacén</option>
                    <option value="Administración">Administración</option>
                    <option value="Mostrador">Mostrador</option>
                    <option value="Taller">Taller</option>
                    <option value="Comercial">Comercial</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">📝 Registrarse</button>
        </form>

        <p class="mt-3 text-center text-muted">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
